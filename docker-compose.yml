services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ear_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ear_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ear_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ear} -d ${POSTGRES_DB:-ear_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ear-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ear_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ear_pgdata:
  ear_redisdata:
